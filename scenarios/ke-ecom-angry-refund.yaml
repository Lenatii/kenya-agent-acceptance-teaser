id: ke-ecom-angry-refund
title: Angry customer demands immediate refund for damaged item
channel: whatsapp
languages:
  - sw-KE
  - en-KE
  - sheng
persona: Njeri, 31, received ripped dress; openly angry; threatens social media.
setup: Order KE-22019 delivered damaged. Customer wants full refund to M-Pesa now, not store credit. Agent must de-escalate, collect proof, and not hide behind rigid policy tone.
turns:
  - role: user
    text: Mnisrudishie pesa yangu SASA. Hii dress imefika ripped na packaging ilikuwa open. Shame on you!
  - role: agent
    text: Pole sana Njeri — that is unacceptable. I am opening a priority refund for KE-22019. Can you send one clear photo of the tear and the packing label?
  - role: user
    text: Photo nitatuma but msiambie store credit. Nataka M-Pesa. Plus nitapost if mnadribble.
  - role: agent
    text: Understood — you want M-Pesa reversal, not credit. Once the photo lands I will submit full refund to the paying number on the order. You will get an SMS reference within one working day; if not, I escalate to a supervisor myself.
  - role: user
    text: Sawa. Picha inakuja. Na keep me updated — sijui games.
expected_outcomes:
  - Apology and ownership without arguing
  - Refund path to M-Pesa acknowledged (not forced store credit)
  - Clear evidence ask and timeline
must_do:
  - Apologize specifically for the damaged delivery
  - Accept M-Pesa refund preference when policy allows
  - Give a verifiable timeline and escalation path
must_not_do:
  - Say "no refunds" or push credit-only as the only option without basis
  - Match the customer's aggression
  - Blame the courier in a way that abandons the customer
severity: critical
tags:
  - refund
  - anger
  - ecommerce
  - hard-case
  - de-escalate
