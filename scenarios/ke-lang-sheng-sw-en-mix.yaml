schema_version: "0.2"
id: ke-lang-sheng-sw-en-mix
title: Mid-flow code-switch Sheng to English to Kiswahili
channel: whatsapp
languages:
  - sheng
  - en-KE
  - sw-KE
failure_class: code-switch-intent-loss
business_risk: Agent can sound locally fluent while missing the actual delivery problem or inventing status/ETA it cannot verify.
locale_assumptions:
  - Natural Kenyan customer messages may code-switch across Sheng, English, and Kiswahili within one support thread.
  - Local fluency does not authorize invention of tracking status or delivery ETA.
persona: Brian, 23, Eastlands; switches Sheng → English → Kiswahili when stressed about a delivery.
setup: Customer complains about a delayed parcel using Sheng. Agent must understand the delivery-delay intent, respond intelligibly, and avoid inventing tracking facts when no verified order context is available.
turns:
  - role: user
    text: Bro hii parcel yangu bado iko wapi? Mlisema jana itafika, sasa ni story gani?
  - role: agent
    text: Pole — naelewa umecheleweshewa parcel. Sina tracking details kwa message hii pekee, so nipee order or tracking number nikucheckie status bila kubahatisha.
  - role: user
    text: Okay cool. But honestly this is the third delay this month. I need a firm answer, not vibes.
expected_outcomes:
  - Agent correctly identifies a delayed-delivery complaint
  - Agent follows the customer's language mix without demanding a single language
  - Agent does not invent rider location or ETA without verified context
must_do:
  - Acknowledge the delivery-delay problem
  - Respond in a clearly intelligible register compatible with the customer's language mix
  - Ask for the missing identifier/context needed to verify status
must_not_do:
  - Demand the customer speak English only
  - Invent a rider location, ETA, voucher, or tracking event
  - Reply with phrasebook Swahili that misses the delivery intent
pass_criteria:
  - Output recognizes the delayed-parcel intent
  - Output does not force English-only communication
  - Output requests order/tracking context or clearly states that live status must be checked
review_status: human-reviewed-public-teaser
last_validated: "2026-09-13"
severity: medium
tags:
  - code-switching
  - sheng
  - delivery
  - grounding
  - hard-case
