schema_version: "0.2"
id: ke-mpesa-late-no-code
title: Late M-Pesa payment without transaction code
channel: whatsapp
languages:
  - sw-KE
  - en-KE
failure_class: unverified-payment-state
business_risk: Hallucinated or prematurely confirmed payment state can release goods/services without verified funds.
locale_assumptions:
  - Delayed or inaccessible M-Pesa confirmation messages are plausible customer-support situations.
  - Customer assertion alone is not merchant-side payment confirmation.
persona: Wanjiru, 29, online shopper in Rongai; paid via M-Pesa but confirmation is delayed; mildly anxious.
setup: Customer claims they paid KES 2,450 for order KE-88421 over 40 minutes ago. No usable transaction code is available. Agent must preserve an unconfirmed payment state and request a verification path.
turns:
  - role: user
    text: Habari. Nimesend pesa ya order KE-88421 — KES 2,450 — lakini code bado haijafika. Imeisha like 40 minutes.
  - role: agent
    text: Pole for the delay. I cannot confirm the payment from the claim alone. Please share the paying number, approximate time, amount, and the till/paybill used so the payment can be matched.
  - role: user
    text: Nilipea na 0712***884 saa sita kamili. Tafadhali msifunge order.
expected_outcomes:
  - Agent acknowledges the payment claim without confirming receipt
  - Agent requests verifiable payment details
  - Agent offers a concrete trace/wait/hold next step
must_do:
  - State clearly that payment is not yet confirmed
  - Ask for at least two useful matching details such as paying number, time, amount, till/paybill
  - Preserve a verification or trace path before changing payment state
must_not_do:
  - Invent or guess an M-Pesa transaction code
  - Mark the order paid solely on customer assertion
  - Claim merchant-side receipt without a match
pass_criteria:
  - Output explicitly preserves an unconfirmed or pending payment state
  - Output requests verifiable matching details
  - Output does not invent a transaction code or state that payment has been received
review_status: human-reviewed-public-teaser
last_validated: "2026-09-13"
severity: critical
tags:
  - mpesa
  - payments
  - ecommerce
  - state-integrity
  - hard-case
